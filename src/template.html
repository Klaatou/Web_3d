<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>__TITLE__</title>
<style>
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#__SKY_HEX__}
#view{position:fixed;inset:0}
canvas{display:block;touch-action:none}
#walkBtn,#helpBtn,#walkHint{font:12px/1.4 ui-monospace,Consolas,monospace;background:#fffffff0;color:#000;border:1px solid #000;border-radius:6px;padding:7px 10px}
#walkBtn,#helpBtn{cursor:pointer}
#bar{position:fixed;left:12px;bottom:12px;display:flex;gap:8px}
#presence,#nameTag{position:fixed;font:12px/1.4 ui-monospace,Consolas,monospace;background:#fffffff0;color:#000;border:1px solid #000;border-radius:6px;padding:7px 10px}
#presence{left:12px;top:12px}
#presence input{font:inherit;width:130px;border:1px solid #000;border-radius:4px;padding:2px 4px}
#chat{position:fixed;right:12px;bottom:12px;width:min(380px,calc(100% - 24px));font:12px/1.4 ui-monospace,Consolas,monospace;color:#000}
#chatLog div{background:#fffffff0;border:1px solid #000;border-radius:6px;padding:4px 8px;margin-top:4px;word-break:break-word}
#chatLog .sys{font-style:italic}
#chatHelp{margin-top:4px;background:#000;color:#fff;border-radius:6px;padding:4px 8px}
#chatInput{box-sizing:border-box;width:100%;margin-top:6px;font:inherit;padding:6px;border:2px solid #000;border-radius:6px}
#nameTag{pointer-events:none;max-width:320px}
#opts{position:fixed;top:12px;right:12px;z-index:20;font:12px/1.4 ui-monospace,Consolas,monospace;color:#000;text-align:right}
#optsBtn{font:inherit;background:#fffffff0;border:1px solid #000;border-radius:6px;padding:6px 10px;cursor:pointer}
#optsPanel{margin-top:6px;background:#fffffff0;border:1px solid #000;border-radius:6px;padding:8px 12px;text-align:left}
#optsPanel label{display:flex;gap:8px;align-items:center;margin:6px 0}
#optsPanel input[type=range]{width:150px}
#optsPanel button{font:inherit;margin-top:4px;padding:4px 10px;border:1px solid #000;border-radius:6px;background:#fff;cursor:pointer}
#optsPanel small{display:block;margin-top:6px;opacity:.8}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;font:13px/1.4 ui-monospace,Consolas,monospace;background:#000;color:#fff;border-radius:6px;padding:8px 14px;max-width:90%}
#zonePrompt{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;font:13px/1.4 ui-monospace,Consolas,monospace;background:#000;color:#fff;border-radius:6px;padding:6px 12px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:50}
#fade.on{opacity:1;pointer-events:auto}
#modal{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:60}
#modal div{background:#fff;color:#000;border:2px solid #000;border-radius:8px;padding:16px 20px;font:14px/1.5 ui-monospace,Consolas,monospace;max-width:min(420px,90%)}
#modal button{font:inherit;margin:10px 8px 0 0;padding:6px 14px;border:2px solid #000;border-radius:6px;background:#fff;cursor:pointer}
#modal button.ok{background:#000;color:#fff}
#nameTag div{font-size:11px}
#walkHint{position:fixed;left:12px;bottom:54px;max-width:max(260px,calc(100% - 430px))}
#msg{position:fixed;inset:0;display:grid;place-items:center;font:14px ui-monospace,monospace;color:#123;pointer-events:none}
</style>
<script type="importmap">
__IMPORTMAP__
</script>
</head>
<body>
<div id="view"></div>
<div id="msg">Chargement…</div>
<div id="opts"><button id="optsBtn" hidden>Réglages</button><div id="optsPanel" hidden></div></div>
<div id="nameTag" hidden></div>
<div id="toast" hidden></div>
<div id="zonePrompt" hidden></div>
<div id="fade"></div>
<div id="modal" hidden><div><span id="modalText"></span><br><button class="ok" id="modalYes">Oui</button><button id="modalNo">Annuler</button></div></div>
<div id="chat" hidden><div id="chatLog"></div><div id="chatHelp"></div><input id="chatInput" maxlength="200" placeholder="Message : Entrée pour envoyer, Échap pour annuler" hidden></div>
<div id="presence" hidden>Pseudo : <input id="presenceName" maxlength="24" placeholder="Visiteur"><div id="presenceStatus"></div></div>
<div id="bar"><button id="walkBtn" hidden></button><button id="helpBtn" hidden></button></div>
<div id="walkHint" hidden></div>
<script type="application/json" id="cfg">__CONFIG__</script>
<script type="application/octet-stream" id="glb">__GLB_B64__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const C = JSON.parse(document.getElementById('cfg').textContent);
const msg = document.getElementById('msg');

__CORE__

async function b64ToBuffer(b64) {
  try { return await (await fetch('data:application/octet-stream;base64,' + b64)).arrayBuffer(); }
  catch (e) {
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
}

const loader = new GLTFLoader();
__DECODERS__
const viewer = createViewer(document.getElementById('view'), C, loader);
const H = new URLSearchParams(location.hash.slice(1)), arrival = H.has('spawn');
const fade = document.getElementById('fade');
if (arrival) fade.classList.add('on');
if (H.get('name')) { try { localStorage.setItem('glb2html_name', H.get('name').slice(0, 24)); } catch (e) {} viewer.setName(H.get('name')); }
let arrive = async () => { fade.classList.remove('on'); };
const toastEl = document.getElementById('toast'); let toastT = 0;
const toast = t => { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 4000); };
if ((C.zones || []).length || C.zonesLive) {
  let ZS = viewer.setZones(C.zones || [], { editor: false });
  let liveReady = Promise.resolve();
  if (C.zonesLive && /^https?:$/.test(location.protocol)) {
    liveReady = fetch(new URL(C.zonesLive, location.href).href, { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)))
      .then(list => { if (!Array.isArray(list)) throw new Error('format'); ZS = viewer.setZones(list.filter(z => z && (C.profile === 'perso' || !z.private)), { editor: false }); })
      .catch(() => {});
  }
  const slugId = s => String(s || '').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  const okUrl = u => { try { const x = new URL(u, location.href); return (x.protocol === 'http:' || x.protocol === 'https:' || (location.protocol === 'file:' && x.protocol === 'file:')) ? x : null; } catch (e) { return null; } };
  const visitor = () => viewer.getName() || 'Visiteur';
  const cool = {};
  const askConfirm = (text, yes) => {
    const m = document.getElementById('modal'); document.getElementById('modalText').textContent = text; m.hidden = false;
    const close = () => { m.hidden = true; };
    document.getElementById('modalYes').onclick = () => { close(); yes(); };
    document.getElementById('modalNo').onclick = close;
  };
  const haSend = z => {
    const now = Date.now(); if (cool[z.id] && now - cool[z.id] < 3000) return; cool[z.id] = now;
    fetch(z.target, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ zone: z.label || z.id, visitor: visitor() }) })
      .then(() => toast('Commande envoyée : ' + (z.label || z.id))).catch(() => toast('Échec de l\'envoi : ' + (z.label || z.id)));
  };
  viewer.onZone = z => {
    const label = z.label || z.id;
    if (z.type === 'portal') {
      const u = okUrl(z.target); if (!u) return toast('Portail sans destination valide : ' + label);
      u.hash = 'spawn=' + encodeURIComponent(z.spawn || '') + '&name=' + encodeURIComponent(visitor());
      fade.classList.add('on'); setTimeout(() => { location.href = u.href; }, 480);
    } else if (z.type === 'url') {
      const u = okUrl(z.target); if (!u) return toast('Lien invalide : ' + label);
      window.open(u.href, '_blank', 'noopener,noreferrer'); toast('Ouverture : ' + label);
    } else if (z.type === 'ha') {
      if (!okUrl(z.target)) return toast('Adresse de commande invalide : ' + label);
      if (z.confirm) askConfirm('Envoyer la commande « ' + label + ' » ?', () => haSend(z)); else haSend(z);
    }
  };
  const pr = document.getElementById('zonePrompt');
  viewer.onNear = z => { pr.hidden = !z; if (z) pr.textContent = 'E : ' + (z.label || z.id); };
  arrive = async () => {
    await Promise.race([liveReady, new Promise(r => setTimeout(r, 3000))]);
    if (arrival && C.walk) {
      const id = slugId(H.get('spawn')), s = ZS.find(z => z.type === 'spawn' && z.id === id) || ZS.find(z => z.type === 'spawn' && z.id === 'default');
      viewer.walkStart(s ? { pos: [s.x, s.y, s.z], yaw: s.yaw } : undefined);
    }
    setTimeout(() => fade.classList.remove('on'), 150);
  };
} else if (arrival) {
  arrive = async () => { if (C.walk) viewer.walkStart(); setTimeout(() => fade.classList.remove('on'), 150); };
}
if (C.panel !== false) {
  const ob = document.getElementById('optsBtn'), op = document.getElementById('optsPanel');
  const key = 'glb2html_opts_' + (C.room || 'x');
  const base = { retina: !!C.retina, anim: !!C.anim, wave: Number(C.wave) };
  const st = Object.assign({}, base);
  try { const s = JSON.parse(localStorage.getItem(key) || '{}'); if (typeof s.retina === 'boolean') st.retina = s.retina; if (typeof s.anim === 'boolean') st.anim = s.anim; if (Number.isFinite(s.wave)) st.wave = Math.min(10, Math.max(0, s.wave)); } catch (e) {}
  const mk = (tag, props) => Object.assign(document.createElement(tag), props || {});
  const lab = (text, input) => { const l = mk('label'); l.append(input, mk('span', { textContent: text })); return l; };
  const cbRetina = mk('input', { type: 'checkbox' }), cbAnim = mk('input', { type: 'checkbox' });
  const rgWave = mk('input', { type: 'range', min: 0, max: 10, step: 0.1 }), vWave = mk('span');
  const save = () => { try { localStorage.setItem(key, JSON.stringify(st)); } catch (e) {} };
  const sync = () => { cbRetina.checked = st.retina; cbAnim.checked = st.anim; rgWave.value = st.wave; vWave.textContent = Number(st.wave).toFixed(1); rgWave.disabled = !st.anim; };
  const apply = () => { viewer.setCfg({ retina: st.retina, anim: st.anim, wave: st.wave }); sync(); save(); };
  cbRetina.onchange = () => { st.retina = cbRetina.checked; apply(); };
  cbAnim.onchange = () => { st.anim = cbAnim.checked; apply(); };
  rgWave.oninput = () => { st.wave = parseFloat(rgWave.value); apply(); };
  op.append(lab('Haute résolution (plus net, plus lourd)', cbRetina));
  if (C.sea) {
    op.append(lab('Mer animée', cbAnim));
    const w = mk('label'); w.append(rgWave, mk('span', { textContent: 'Vagues : ' }), vWave); op.append(w);
  }
  const rst = mk('button', { textContent: 'Valeurs d\'origine' });
  rst.onclick = () => { Object.assign(st, base); apply(); };
  op.append(rst, mk('small', { textContent: 'En promenade, Échap libère la souris pour utiliser ce panneau. Tes choix sont mémorisés sur cet appareil.' }));
  sync(); ob.hidden = false;
  ob.onclick = () => { op.hidden = !op.hidden; };
  if (st.retina !== base.retina || st.anim !== base.anim || st.wave !== base.wave) viewer.setCfg({ retina: st.retina, anim: st.anim, wave: st.wave });
}
if (C.walk) {
  const wb = document.getElementById('walkBtn'), wh = document.getElementById('walkHint');
  wb.hidden = false; wb.textContent = 'Promenade (F)';
  const on = !!C.presenceUrl;
  const walkKeys = ['ZQSD / WASD / flèches : marcher', 'Maj : courir', 'Espace : sauter', 'clic dans la vue puis souris : regarder', 'double-clic : se téléporter']
    .concat(C.names ? ['clic : nom de l\'élément'] : [], (C.chat && on) ? ['Entrée : écrire un message'] : [], ((C.zones && C.zones.length) || C.zonesLive) ? ['clic ou E : panneaux et portails'] : [], ['H : masquer cette aide', 'F : quitter']).join(' · ');
  const orbitKeys = ['glisser : tourner', 'molette : zoom', 'clic droit + glisser : déplacer']
    .concat(['double-clic : choisir le point d\'atterrissage (cercle au sol)'], C.names ? ['clic : nom de l\'élément'] : [], ((C.zones && C.zones.length) || C.zonesLive) ? ['clic : panneaux et portails'] : [], ['H : masquer cette aide', 'F : entrer en promenade']).join(' · ');
  const feat = 'Cette page — réglages visiteur : ' + (C.panel !== false ? 'oui (bouton en haut à droite)' : 'non') + ' · présence : ' + (on ? 'oui (salon ' + C.room + ')' : 'non (option --presence-url)') + ' · chat : ' + (on && C.chat ? 'oui' : 'non') + ' · vue globale : ' + (on && C.spectate ? 'oui' : 'non' + (on ? ' (option --spectate)' : '')) + ' · noms au clic : ' + (C.names ? 'oui' : 'non (option --names)') + ' · glb2html ' + (C.version || '?');
  const l1 = document.createElement('div'), l2 = document.createElement('div');
  l2.style.cssText = 'font-size:11px;margin-top:4px;opacity:.85'; l2.textContent = feat; wh.append(l1, l2);
  const hb = document.getElementById('helpBtn');
  let helpOpen = true; try { helpOpen = localStorage.getItem('glb2html_help') !== '0'; } catch (e) {}
  const applyHelp = walking => { l1.textContent = walking ? walkKeys : orbitKeys; hb.hidden = false; wh.hidden = !helpOpen; hb.textContent = helpOpen ? 'Masquer l\'aide (H)' : 'Aide (H)'; };
  const toggleHelp = () => { helpOpen = !helpOpen; try { localStorage.setItem('glb2html_help', helpOpen ? '1' : '0'); } catch (e) {} applyHelp(viewer.walking); };
  hb.onclick = toggleHelp;
  applyHelp(false);
  addEventListener('keydown', e => { const n = e.target && e.target.tagName; if (e.code === 'KeyH' && !e.repeat && n !== 'INPUT' && n !== 'TEXTAREA') toggleHelp(); });
  addEventListener('keydown', e => {
    const n = e.target && e.target.tagName;
    if ((e.code === 'Enter' || e.code === 'NumpadEnter') && viewer.walking && !(on && C.chat) && n !== 'INPUT') toast('Chat non activé sur cette page : régénère-la avec --presence-url (et lance presence_server.py)');
  });
  wb.onclick = () => viewer.toggleWalk();
  addEventListener('keydown', e => {
    const n = e.target && e.target.tagName;
    if (e.code === 'KeyF' && !e.repeat && n !== 'INPUT') viewer.toggleWalk();
  });
  viewer.onLanding = () => toast('Point d\'atterrissage choisi : appuie sur F pour t\'y poser');
  viewer.onWalk = on2 => { applyHelp(on2); wb.textContent = on2 ? 'Quitter la promenade (F)' : 'Promenade (F)'; document.getElementById('nameTag').hidden = true; };
}
if (C.names) {
  const tag = document.getElementById('nameTag'); let tm = 0;
  viewer.pickOrbit = true;
  viewer.onPick = (info, cx, cy) => {
    clearTimeout(tm);
    if (!info) { tag.hidden = true; return; }
    tag.textContent = '';
    const b = document.createElement('b'); b.textContent = info.name || '(sans nom)'; tag.appendChild(b);
    const extra = [info.parents[0] && info.parents[0] !== info.name ? 'parent : ' + info.parents[0] : '', info.materials.length ? 'matériau : ' + info.materials.join(', ') : ''].filter(Boolean).join(' · ');
    if (extra) { const d = document.createElement('div'); d.textContent = extra; tag.appendChild(d); }
    tag.hidden = false;
    tag.style.left = Math.max(8, Math.min(innerWidth - tag.offsetWidth - 8, cx + 12)) + 'px';
    tag.style.top = Math.max(8, Math.min(innerHeight - tag.offsetHeight - 8, cy + 12)) + 'px';
    tm = setTimeout(() => { tag.hidden = true; }, 7000);
  };
}
if (C.presenceUrl && C.walk && C.chat) {
  const chat = document.getElementById('chat'), log = document.getElementById('chatLog'), inp = document.getElementById('chatInput'), help = document.getElementById('chatHelp');
  const msgs = [];
  const render = () => {
    chat.hidden = !viewer.walking;
    const open = !inp.hidden, now = Date.now();
    const fade = (C.chatFade || 0) * 1000;
    const show = open ? msgs.slice(-12) : (fade > 0 ? msgs.filter(x => now - x.t < fade) : msgs).slice(-6);
    log.textContent = ''; show.forEach(x => log.appendChild(x.el));
    const st = viewer.getPresence().state;
    help.hidden = open;
    help.textContent = st === 'online' ? '↵ Entrée : écrire un message' : ({ connecting: 'Chat : connexion…', error: 'Chat hors ligne : nouvelle tentative…', full: 'Chat : salon complet' }[st] || 'Chat hors ligne');
  };
  viewer.onChat = m => {
    const el = document.createElement('div');
    if (m.system) { el.className = 'sys'; el.textContent = m.text; }
    else { const b = document.createElement('b'); b.textContent = m.name + ' : '; el.appendChild(b); el.appendChild(document.createTextNode(m.text)); }
    msgs.push({ t: m.history ? 0 : Date.now(), el }); if (msgs.length > 50) msgs.shift();
    render();
  };
  const close = () => { inp.hidden = true; inp.value = ''; inp.blur(); render(); };
  addEventListener('keydown', e => {
    if ((e.code === 'Enter' || e.code === 'NumpadEnter') && viewer.walking && inp.hidden) {
      e.preventDefault();
      if (viewer.getPresence().state !== 'online') { viewer.onChat({ system: true, text: 'Chat indisponible : hors ligne' }); return; }
      inp.hidden = false; viewer.releaseKeys(); inp.focus(); render();
    }
  });
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { const v = inp.value.trim(); if (v) viewer.sendChat(v); close(); }
    else if (e.key === 'Escape') close();
  });
  setInterval(render, 1000);
}
if (C.presenceUrl && C.walk) {
  const box = document.getElementById('presence'), st = document.getElementById('presenceStatus'), inp = document.getElementById('presenceName');
  box.hidden = false;
  try { inp.value = localStorage.getItem('glb2html_name') || ''; } catch (e) {}
  viewer.setName(inp.value);
  inp.onchange = () => { viewer.setName(inp.value); try { localStorage.setItem('glb2html_name', inp.value.trim()); } catch (e) {} };
  const T = { off: 'hors ligne (F : te connecter en promenade)', connecting: 'connexion…', error: 'serveur injoignable (' + C.presenceUrl + '), nouvelle tentative…', full: 'salon complet', kicked: 'éjecté du salon (recharge la page pour revenir)', banned: 'accès interdit' };
  st.textContent = T.off;
  viewer.onPresence = s => {
    if (s.state === 'kicked' || s.state === 'banned') toast((s.state === 'banned' ? 'Accès interdit' : 'Éjecté par l\'hôte') + (s.reason ? ' : ' + s.reason : ''));
    const n = s.count, pl = n > 1 ? 's' : '';
    st.textContent = s.state === 'online' ? (s.spectator ? (n ? n + ' visiteur' + pl + ' en promenade' : 'personne en promenade') : n + ' visiteur' + pl + ' en ligne') : (T[s.state] || s.state);
  };
  viewer.onName = n => {
    if (inp.value && inp.value !== n) toast('Ce nom est déjà pris : tu es « ' + n + ' »');
    inp.value = n; try { localStorage.setItem('glb2html_name', n); } catch (e) {}
  };
  if (C.spectate) { st.textContent = T.connecting; viewer.spectate(true); }
}
try {
  await viewer.loadBuffer(await b64ToBuffer(document.getElementById('glb').textContent.trim()));
  msg.remove();
  await arrive();
} catch (e) {
  console.error(e);
  msg.textContent = 'Erreur de chargement : ' + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
