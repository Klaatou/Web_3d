<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" width="1100" height="730" role="img" aria-label="OAR to GLB to web page" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How it works</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect x="1" y="1" width="1098" height="728" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>
<text x="550.0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1b2a41">How it works</text>
<rect x="30" y="108" width="150" height="84" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="105.0" y="145.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">OAR</text>
<text x="105.0" y="165.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">OpenSim backup</text>
<rect x="215" y="108" width="215" height="84" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5"/>
<text x="322.5" y="145.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">oar2glb.py</text>
<text x="322.5" y="165.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">needs convoar.exe *</text>
<rect x="222" y="94" width="31" height="26" rx="13" fill="#1b2a41"/><text x="237.5" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<rect x="470" y="62" width="600" height="154" rx="14" fill="none" stroke="#5b6b7d" stroke-width="2" stroke-dasharray="3 5"/>
<text x="484" y="84" text-anchor="start" font-size="15" fill="#1b2a41">The model</text>
<rect x="492" y="100" width="122" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="553.0" y="145.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">GLB</text>
<text x="553.0" y="165.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">the .glb file</text>
<rect x="654" y="100" width="190" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5" stroke-dasharray="9 6"/>
<text x="749.0" y="145.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">glb2tiles.py</text>
<text x="749.0" y="165.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">huge regions only</text>
<rect x="661" y="86" width="130" height="26" rx="13" fill="#1b2a41"/><text x="726.0" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 (optional)</text>
<rect x="886" y="100" width="172" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="972.0" y="135.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">tiles + overview</text>
<text x="972.0" y="155.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">NOM.tiles/</text>
<text x="972.0" y="175.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">NOM.overview.glb</text>
<polyline points="180,150 215,150" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="430,150 492,150" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="614,150 654,150" fill="none" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<polyline points="844,150 886,150" fill="none" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="440" y="262" width="250" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5"/>
<text x="565.0" y="297.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">glb-viewer.html</text>
<text x="565.0" y="317.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">settings + zones</text>
<text x="565.0" y="337.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">exports the page</text>
<rect x="447" y="248" width="157" height="26" rx="13" fill="#1b2a41"/><text x="525.5" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 (interactive)</text>
<rect x="830" y="262" width="250" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5"/>
<text x="955.0" y="297.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">glb2html.py</text>
<text x="955.0" y="317.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">builds the page</text>
<text x="955.0" y="337.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">needed for tiled regions</text>
<rect x="837" y="248" width="166" height="26" rx="13" fill="#1b2a41"/><text x="920.0" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 (command line)</text>
<polyline points="650,216 650,262" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="1040,216 1040,262" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="690,312 830,312" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<text x="760" y="292" text-anchor="middle" font-size="13" fill="#1b2a41">NOM.config.json</text>
<text x="760" y="336" text-anchor="middle" font-size="13" fill="#1b2a41">NOM.zones.json</text>
<rect x="520" y="470" width="480" height="96" rx="12" fill="#e9eef3" stroke="#1b2a41" stroke-width="3.5"/>
<text x="760.0" y="503.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">Web page</text>
<text x="760.0" y="523.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">index.html + NOM.* + lib/</text>
<text x="760.0" y="543.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">three.js, in the browser</text>
<polyline points="565,362 565,470" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="955,362 955,470" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<rect x="520" y="620" width="250" height="84" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="645.0" y="657.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">presence_server.py</text>
<text x="645.0" y="677.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">optional, separate program</text>
<rect x="527" y="606" width="130" height="26" rx="13" fill="#1b2a41"/><text x="592.0" y="624" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4 (optional)</text>
<polyline points="645,620 645,566" fill="none" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<text x="662" y="598" text-anchor="start" font-size="14" fill="#1b2a41">WebSocket: chat, visitors</text>
<rect x="30" y="262" width="400" height="214" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="48" y="290" text-anchor="start" font-size="16" fill="#1b2a41">Legend</text>
<text x="48" y="290" font-size="16" font-weight="700" fill="#1b2a41" opacity="0">.</text>
<line x1="48" y1="318" x2="118" y2="318" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<text x="132" y="323" text-anchor="start" font-size="14" fill="#1b2a41">always</text>
<line x1="48" y1="346" x2="118" y2="346" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<text x="132" y="351" text-anchor="start" font-size="14" fill="#1b2a41">optional</text>
<text x="48" y="392" text-anchor="start" font-size="13" fill="#1b2a41">* oar2glb.py needs the external converter convoar.exe.</text>
<text x="48" y="418" text-anchor="start" font-size="13" fill="#1b2a41">NOM = the name of your region.</text>
<text x="48" y="444" text-anchor="start" font-size="13" fill="#1b2a41">Tiled region: the viewer only places the zones.</text>
</svg>