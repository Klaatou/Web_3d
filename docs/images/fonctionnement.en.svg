<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" role="img" aria-label="OAR to GLB to web page" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How it works</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect x="1" y="1" width="1098" height="778" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>
<text x="550.0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1b2a41">How it works</text>
<rect x="30" y="116" width="150" height="84" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="105.0" y="153.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">OAR</text>
<text x="105.0" y="173.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">OpenSim backup</text>
<rect x="215" y="116" width="215" height="84" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5"/>
<text x="322.5" y="153.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">oar2glb.py</text>
<text x="322.5" y="173.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">needs convoar.exe *</text>
<rect x="222" y="102" width="31" height="26" rx="13" fill="#1b2a41"/><text x="237.5" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<rect x="470" y="62" width="600" height="170" rx="14" fill="none" stroke="#7c8a99" stroke-width="1.6"/>
<text x="484" y="84" text-anchor="start" font-size="15" font-weight="400" font-style="normal" fill="#1b2a41">The model</text>
<rect x="492" y="100" width="122" height="116" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="553.0" y="153.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">GLB</text>
<text x="553.0" y="173.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">the .glb file</text>
<rect x="654" y="100" width="190" height="116" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5" stroke-dasharray="9 6"/>
<text x="749.0" y="153.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">glb2tiles.py</text>
<text x="749.0" y="173.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">huge regions only</text>
<rect x="661" y="86" width="130" height="26" rx="13" fill="#1b2a41"/><text x="726.0" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 (optional)</text>
<rect x="886" y="100" width="172" height="116" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="972.0" y="133.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">tiles + overview</text>
<text x="972.0" y="153.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">NOM.tiles.json</text>
<text x="972.0" y="173.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">NOM.tiles/</text>
<text x="972.0" y="193.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">NOM.overview.glb</text>
<polyline points="180,158 215,158" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="430,158 492,158" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="614,158 654,158" fill="none" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<polyline points="844,158 886,158" fill="none" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<rect x="215" y="262" width="215" height="64" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2"/>
<text x="322.5" y="289.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">your own .glb</text>
<text x="322.5" y="309.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">direct entry, no OAR</text>
<polyline points="430,294 530,294 530,216" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<rect x="440" y="360" width="250" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5"/>
<text x="565.0" y="395.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">glb-viewer.html</text>
<text x="565.0" y="415.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">settings + zones</text>
<text x="565.0" y="435.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">exports the page (not for tiles)</text>
<rect x="447" y="346" width="166" height="26" rx="13" fill="#1b2a41"/><text x="530.0" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3a (interactive)</text>
<rect x="830" y="360" width="250" height="100" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="3.5"/>
<text x="955.0" y="395.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">glb2html.py</text>
<text x="955.0" y="415.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">builds the page</text>
<text x="955.0" y="435.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">needed for tiled regions</text>
<rect x="837" y="346" width="175" height="26" rx="13" fill="#1b2a41"/><text x="924.5" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3b (command line)</text>
<polyline points="650,232 650,360" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="1040,232 1040,360" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<text x="660" y="290" text-anchor="start" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">GLB or tiles</text>
<text x="1032" y="290" text-anchor="end" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">GLB or tiles</text>
<polyline points="690,420 830,420" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<text x="760" y="372" text-anchor="middle" font-size="17" font-weight="700" font-style="normal" fill="#1b2a41">OR</text>
<text x="760" y="390" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#1b2a41">files reused:</text>
<text x="760" y="408" text-anchor="middle" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">NOM.config.json</text>
<text x="760" y="442" text-anchor="middle" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">NOM.zones.json</text>
<rect x="520" y="520" width="480" height="96" rx="12" fill="#e9eef3" stroke="#1b2a41" stroke-width="3.5"/>
<text x="760.0" y="553.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">Web page</text>
<text x="760.0" y="573.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">index.html + NOM.* + lib/</text>
<text x="760.0" y="593.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">three.js, in the browser</text>
<polyline points="565,460 565,520" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<polyline points="955,460 955,520" fill="none" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<rect x="520" y="670" width="250" height="84" rx="12" fill="#f4f6f8" stroke="#1b2a41" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="645.0" y="707.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a41">presence_server.py</text>
<text x="645.0" y="727.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2a41">optional, separate program</text>
<rect x="527" y="656" width="130" height="26" rx="13" fill="#1b2a41"/><text x="592.0" y="674" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4 (optional)</text>
<polyline points="645,670 645,616" fill="none" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<text x="662" y="648" text-anchor="start" font-size="14" font-weight="400" font-style="normal" fill="#1b2a41">WebSocket: chat, visitors</text>
<rect x="30" y="360" width="400" height="214" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="48" y="388" text-anchor="start" font-size="16" font-weight="700" font-style="normal" fill="#1b2a41">Legend</text>
<line x1="48" y1="416" x2="118" y2="416" stroke="#1b2a41" stroke-width="2.6" marker-end="url(#a)"/>
<text x="132" y="421" text-anchor="start" font-size="14" font-weight="400" font-style="normal" fill="#1b2a41">always</text>
<line x1="48" y1="444" x2="118" y2="444" stroke="#1b2a41" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#a)"/>
<text x="132" y="449" text-anchor="start" font-size="14" font-weight="400" font-style="normal" fill="#1b2a41">optional</text>
<text x="48" y="490" text-anchor="start" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">* oar2glb.py needs the external converter convoar.exe.</text>
<text x="48" y="516" text-anchor="start" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">NOM = the name of your region.</text>
<text x="48" y="542" text-anchor="start" font-size="13" font-weight="400" font-style="normal" fill="#1b2a41">Tiled region: the viewer only places the zones.</text>
</svg>